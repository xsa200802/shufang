<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>书房 · 名著与心理学</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header">
  <h1>书房<span class="seal">读</span></h1>
  <p class="subtitle">四大名著 · 阿德勒 · 弗洛伊德与荣格 · 中医经典</p>
  <div class="header-rule" aria-hidden="true"></div>
</header>

<main id="shelf">
  <p class="loading">正在打开书架…</p>
</main>

<footer class="site-footer">
  <p>四大名著与中医经典为公版原文；阿德勒、弗洛伊德、荣格著作为流传译本，部分为扫描识别文本，或有少量识别错误。仅供个人阅读。</p>
</footer>

<script>
const SECTION_NAMES = {
  classics: "四大名著",
  adler: "阿德勒心理学",
  "freud-jung": "弗洛伊德与荣格",
  tcm: "中医经典"
};
const SECTION_ORDER = ["classics", "adler", "freud-jung", "tcm"];
const SEAL = { classics: "藏", adler: "心", "freud-jung": "梦", tcm: "医" };

function fmtChars(n) {
  if (n >= 10000) return (n / 10000).toFixed(1).replace(/\.0$/, "") + " 万字";
  return n + " 字";
}

function progressOf(id) {
  try {
    const p = JSON.parse(localStorage.getItem("read-progress-" + id) || "null");
    return p && p.ch ? p : null;
  } catch (e) { return null; }
}

async function load() {
  const res = await fetch("catalog.json");
  const books = await res.json();
  const shelf = document.getElementById("shelf");
  shelf.innerHTML = "";
  for (const section of SECTION_ORDER) {
    const list = books.filter(b => b.section === section);
    if (!list.length) continue;
    const h = document.createElement("h2");
    h.className = "section-title";
    h.textContent = SECTION_NAMES[section];
    shelf.appendChild(h);
    const grid = document.createElement("div");
    grid.className = "book-grid";
    for (const b of list) {
      const p = progressOf(b.id);
      const card = document.createElement("article");
      card.className = "book-card sec-" + b.section;
      card.innerHTML =
        '<div class="book-cover">' +
          '<span class="cover-seal">' + (SEAL[b.section] || "藏") + '</span>' +
          '<span class="cover-title">' + b.title + '</span>' +
          '<span class="cover-author">' + b.author + '</span>' +
        '</div>' +
        '<div class="book-card-body">' +
          '<h3 class="book-title">' + b.title + '</h3>' +
          '<p class="book-author">' + b.author + '</p>' +
          '<p class="book-intro">' + b.intro + '</p>' +
          '<p class="book-meta">' + b.chapters + ' 章 · ' + fmtChars(b.chars) + '</p>' +
          (p ? '<p class="book-continue">上次读到第 ' + p.ch + ' 章</p>' : '') +
          '<a class="book-btn" href="reader.html?book=' + b.id + (p ? '&ch=' + p.ch : '') + '">' +
          (p ? "继续阅读" : "开始阅读") + '</a>' +
        '</div>';
      grid.appendChild(card);
    }
    shelf.appendChild(grid);
  }
}

load().catch(() => {
  document.getElementById("shelf").innerHTML =
    '<p class="loading">书架打不开，请检查网络后刷新。</p>';
});
</script>
</body>
</html>
